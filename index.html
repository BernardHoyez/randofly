<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RandoFly — Survol virtuel 3D</title>
<meta name="description" content="Génère un survol virtuel 3D fluide d'une randonnée à partir d'un fichier GPX, KML ou KMZ.">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>🪂 RandoFly</h1>
  <p class="subtitle">Survol virtuel 3D d'une randonnée — GPX / KML / KMZ</p>
</header>

<div id="global-error" class="global-error" hidden>
  <div class="global-error-text"></div>
  <button class="global-error-copy" title="Copier le message">📋</button>
  <button class="global-error-close" title="Fermer">✕</button>
</div>

<main>
  <section id="panel-import" class="panel">
    <label class="dropzone" id="dropzone" for="file-input">
      <span id="dropzone-text">Déposer ou choisir un fichier .gpx, .kml ou .kmz</span>
      <input type="file" id="file-input" accept=".gpx,.kml,.kmz" hidden>
    </label>
    <div id="import-error" class="error" hidden></div>
  </section>

  <section id="panel-settings" class="panel" hidden>
    <div class="settings-grid">
      <label>Altitude de survol (m au-dessus du sol)
        <input type="number" id="altitude-input" value="150" min="20" max="1000" step="10">
      </label>
      <label>Vitesse de survol (km/h)
        <input type="number" id="speed-input" value="40" min="5" max="200" step="5">
      </label>
      <label>Inclinaison caméra
        <input type="range" id="pitch-input" min="40" max="85" value="68" step="1">
      </label>
    </div>
    <div id="summary" class="summary"></div>
    <div class="actions">
      <button id="btn-recompute" class="secondary">Recalculer le survol</button>
    </div>
  </section>

  <section id="panel-map" class="panel" hidden>
    <div id="map"></div>
    <div id="waypoint-label" class="waypoint-label" hidden></div>
    <div id="loading-overlay" class="loading-overlay" hidden><span></span></div>

    <div class="player">
      <button id="btn-play" title="Lecture">▶</button>
      <button id="btn-pause" title="Pause" hidden>⏸</button>
      <button id="btn-restart" title="Revenir au début">⏮</button>
      <input type="range" id="progress" min="0" max="1000" value="0">
      <span id="time-label">0:00 / 0:00</span>
      <button id="btn-overview" title="Vue d'ensemble">🗺️</button>
      <button id="btn-export" title="Exporter en vidéo">⏺ Exporter</button>
    </div>
    <p class="attribution">Fond orthophoto : © IGN Géoplateforme. Altitudes : fichier source ou service d'altimétrie IGN (RGE ALTI).</p>
  </section>

  <div id="export-status" class="export-status" hidden></div>
</main>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="geo.js"></script>
<script src="parse.js"></script>
<script src="elevation.js"></script>
<script src="flight.js"></script>
<script src="app.js"></script>
</body>
</html>
